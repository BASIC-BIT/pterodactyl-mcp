name: Code quality
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    name: Code quality ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: BASIC-BIT/quality-ratchet@a0dfcca184fd83f0a23762f29353c7772c17906f # v1.1.0
        with:
          github-token: ${{ github.token }}
          repository-path: ${{ github.workspace }}
